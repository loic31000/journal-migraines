# Tests à chaque push et à chaque pull request, sur toutes les branches (main comprise).
# APK de test : fabriqué pour chaque push sur une autre branche que main, ou à la demande.
# Version « debug » : identifiant fr.journalmigraines.app.test, nom « Mon Journal (test) ».
# Elle s'installe à côté de la vraie appli, avec ses propres notes : rien n'est touché.
# Téléchargement : onglet Actions › le dernier « Tests et APK de test » › Artifacts › mon-journal-test-apk.
# Les actions sont épinglées sur une empreinte (version indiquée en commentaire) ; Dependabot les met à jour.
name: Tests et APK de test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Failles connues dans les dépendances
        run: npm audit --audit-level=high

  apk:
    needs: tests
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm ci

      - name: Copie de l'appli dans le projet Android
        run: npm run sync

      - name: Fabrication de l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mon-journal-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
